name: Build and signaling tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  STREAMROOM_VERSION: 0.5.${{ github.run_number }}
jobs:
  stage-one:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Verify experimental ZeroTier candidate guards
        run: node --test scripts/diagnostics/zerotier-routing.test.mjs
      - name: Check application JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src/StreamRoom.App/Web -File | Where-Object Extension -in '.mjs','.js' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }
      - run: npm run check
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: dotnet build src/StreamRoom.App/StreamRoom.App.csproj -c Release
      - name: Verify saved friends and Google login callback safety
        shell: pwsh
        run: |
          dotnet src/StreamRoom.App/bin/Release/net10.0-windows10.0.22621.0/StreamRoom.dll --account-self-test account-test.json
          if ($LASTEXITCODE -ne 0 -or !(Get-Content account-test.json | ConvertFrom-Json).success) { throw 'Account tests failed.' }
          dotnet src/StreamRoom.App/bin/Release/net10.0-windows10.0.22621.0/StreamRoom.dll --profile-self-test profile-test.json
          if ($LASTEXITCODE -ne 0 -or !(Get-Content profile-test.json | ConvertFrom-Json).success) { throw 'Animated profile tests failed.' }
      - run: dotnet run --project tests/StreamRoom.NetworkTests -c Release
      - name: Start local Cloudflare runtime and run integration tests
        shell: pwsh
        run: |
          $worker = Start-Process -FilePath node -ArgumentList 'node_modules/wrangler/bin/wrangler.js','dev','--ip','127.0.0.1','--port','8787' -WorkingDirectory server -PassThru -WindowStyle Hidden -RedirectStandardOutput worker.out.log -RedirectStandardError worker.err.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($worker.HasExited) { throw 'Worker failed to start.' }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8787/health -TimeoutSec 1
                if ($health.protocol -eq 2) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Worker startup timed out.' }
            Push-Location server
            try { npm test; if ($LASTEXITCODE -ne 0) { throw 'Worker tests failed.' } } finally { Pop-Location }
            dotnet run --project tests/StreamRoom.Smoke -c Release
            if ($LASTEXITCODE -ne 0) { throw 'C# integration tests failed.' }
            dotnet src/StreamRoom.App/bin/Release/net10.0-windows10.0.22621.0/StreamRoom.dll --people-self-test people-test.json http://127.0.0.1:8787
            if ($LASTEXITCODE -ne 0 -or !(Get-Content people-test.json | ConvertFrom-Json).success) { throw 'Public profile integration failed.' }
          } finally {
            taskkill /PID $worker.Id /T /F 2>$null
            Get-Content worker.out.log,worker.err.log -ErrorAction SilentlyContinue
            $global:LASTEXITCODE = 0
          }
      - name: Build portable development app
        run: dotnet publish src/StreamRoom.App/StreamRoom.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true "-p:Version=$env:STREAMROOM_VERSION" -o artifacts/publish
      - uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          ref: d07030c0968e31e41caa0c35fda0ef8ae63a079e
          path: artifacts/vendor/Vencord
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EduardoVasconceloss/StreamFix
          ref: 30c90e1518048b7c24ecede9019489b4233af72b
          path: artifacts/vendor/StreamFix
          persist-credentials: false
      - name: Build the optional Discord integration
        shell: pwsh
        run: |
          npm install --global pnpm@12.15.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned pnpm version.' }
          ./scripts/build-discord-experiment.ps1 -VencordSource artifacts/vendor/Vencord -StreamFixSource artifacts/vendor/StreamFix -PublishDirectory artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: StreamRoom-win-x64-development
          path: artifacts/publish/
          retention-days: 14
      - name: Create development installer and update feed
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Velopack CLI restore failed.' }
          dotnet tool run vpk pack --packId StreamRoom --packVersion $env:STREAMROOM_VERSION --packDir artifacts/publish --mainExe StreamRoom.exe --packTitle StreamRoom --icon src/StreamRoom.App/Assets/StreamRoom.ico --framework webview2 --runtime win-x64 --outputDir artifacts/installer --channel win
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed.' }
          Copy-Item -LiteralPath artifacts/installer/releases.win.json -Destination artifacts/installer/releases.win-discord.json
          $checksums = Get-ChildItem artifacts/installer -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $_.Name
          }
          $checksums | Set-Content -LiteralPath artifacts/installer/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: StreamRoom-installer-development
          path: artifacts/installer/
          retention-days: 14

  release:
    name: Publish Windows update
    needs: stage-one
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: streamroom-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamRoom-installer-development
          path: artifacts/installer
      - name: Publish installer and update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the main branch.' }
          if ($head -ne $env:GITHUB_SHA) { Write-Host 'A newer commit will publish the next update.'; exit 0 }
          $tag = "v$env:STREAMROOM_VERSION"
          $files = @(Get-ChildItem artifacts/installer -File | ForEach-Object { $_.FullName })
          if (!$files.Count) { throw 'Installer artifacts are missing.' }
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { Write-Host 'Release already published.'; exit 0 }
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "StreamRoom $env:STREAMROOM_VERSION" --notes "O assistente opcional de compartilhamento no Discord já está em Conexões. Quem já usa o StreamRoom recebe a versão por Atualizações." --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }
          gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload update files.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
