name: Build an approved release candidate (no publication)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, e.g. 0.2.0 or 0.3.0-beta.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build candidate installer
        shell: pwsh
        env:
          STREAMROOM_VERSION: ${{ inputs.version }}
        run: |
          if ($env:STREAMROOM_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version.' }
          ./scripts/build-installer.ps1 -Version $env:STREAMROOM_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: StreamRoom-release-candidate
          path: artifacts/installer/
          retention-days: 30
